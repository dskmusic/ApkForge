name: Build release APK

# Manual: GitHub -> Actions -> "Build release APK" -> Run workflow.
# Compila ApkForge firmado con la clave de debug de Android (sin secretos) y lo publica como Release
# con el nombre fijo "ApkForge.apk" (la web enlaza siempre a la ultima).
# Builds ApkForge signed with the Android debug key (no secrets) and publishes it as a Release.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (vacio = version.properties / empty = version.properties)'
        required: false
        type: string
      notes:
        description: 'Novedades / Release notes (opcional)'
        required: false
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Version
        id: ver
        run: |
          V="${{ inputs.version_name }}"
          if [ -z "$V" ]; then V=$(grep -oP '^versionName=\K.*' version.properties | tr -d '\r '); fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build (debug signature)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }} --no-daemon

      - name: Prepare APK
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" ApkForge.apk
          ls -lh ApkForge.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: ApkForge ${{ steps.ver.outputs.name }}
          body: ${{ inputs.notes }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.notes == '' }}
          files: ApkForge.apk
